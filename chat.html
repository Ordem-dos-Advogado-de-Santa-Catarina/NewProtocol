<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com a Mila</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <script>
        // PARTE 1: Configurações e inicialização do Chatwoot (sem alterações)
        window.chatwootSettings = {
            hideMessageBubble: true,
            position: "right",
            type: "standard",
            launcherTitle: "Chat com a Mila"
        };
        
        (function(d,t) {
            var BASE_URL="https://chat.oab-sc.org.br";
            var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
            g.src=BASE_URL+"/packs/js/sdk.js";
            g.defer = true;
            g.async = true;
            s.parentNode.insertBefore(g,s);
            g.onload=function(){
                window.chatwootSDK.run({
                    websiteToken: '7sZnCxydxqbTSbU8sP2AXg8t',
                    baseUrl: BASE_URL
                })
            }
        })(document,"script");

        window.addEventListener('chatwoot:ready', function () {
            window.$chatwoot.toggle('open');
        });

        // =====================================================================
        // PARTE 2: A SOLUÇÃO FINAL - O VIGIA DE CLASSE
        // =====================================================================

        const setupAntiCloseObserver = () => {
            const widgetHolder = document.querySelector('#cw-widget-holder');

            if (widgetHolder) {
                console.log('Container do Chatwoot encontrado. Anexando o vigia de classe.');

                // 1. Criamos o observador que vai reagir a mudanças.
                const classObserver = new MutationObserver((mutationsList) => {
                    // Loop através de cada mutação detectada (geralmente será apenas uma)
                    for (const mutation of mutationsList) {
                        // Verificamos se a mutação foi no atributo 'class'
                        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                            const targetElement = mutation.target;
                            
                            // 2. A CONDIÇÃO: Se a classe 'woot--hide' foi adicionada...
                            if (targetElement.classList.contains('woot--hide')) {
                                console.log("Ação de fechar detectada. Revertendo...");
                                
                                // 3. A AÇÃO: ...nós a removemos imediatamente!
                                targetElement.classList.remove('woot--hide');
                            }
                        }
                    }
                });

                // 4. Dizemos ao observador para começar a vigiar o container do widget.
                classObserver.observe(widgetHolder, {
                    attributes: true, // Queremos observar mudanças de atributos.
                    attributeFilter: ['class'] // E SÓ nos importamos com o atributo 'class'.
                });

            } else {
                // Se o container ainda não existe, tenta de novo em breve.
                setTimeout(setupAntiCloseObserver, 200);
            }
        };

        // Inicia o processo de busca pelo container do chat.
        setupAntiCloseObserver();
    </script>

</body>
</html>
