<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags para compartilhamento social (OGP e Twitter Cards) -->
        <meta property="og:title" content="Portal de Acesso - OAB/SC">
        <meta property="og:description" content="Centralize e organize seus protocolos de atendimento na OAB/SC de forma eficiente.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://portal.oab-sc.org.br/">
        <meta property="og:image" content="https://portal.oab-sc.org.br/site/images/portal.jpg">
        <meta property="og:image:alt" content="Logo OAB/SC">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Portal de Acesso - OAB/SC">
        <meta name="twitter:description" content="Centralize e organize seus protocolos de atendimento na OAB/SC de forma eficiente.">
        <meta name="twitter:image" content="https://portal.oab-sc.org.br/site/images/portal.jpg">
        <meta name="twitter:image:alt" content="Logo OAB/SC">
    <title>Portal de Acesso OAB-SC</title>
    <!-- Define o favicon da página -->
    <link rel="icon" href="https://portal.oab-sc.org.br/site/images/fav.png" type="image/png">
    <style>
        /* Estilos gerais */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
        }

        /* Wrapper para o iframe principal (para esconder a barra de rolagem) */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Iframe do site principal */
        #main-iframe {
            width: calc(100% + 17px);
            height: 100%;
            border: none;
            display: block;
        }

        /* --- ESTILO CORRIGIDO PARA O IFRAME DO CHAT --- */
        #chat-overlay-iframe {
            /* Posiciona o iframe como uma camada sobre toda a página */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Garante que ele fique acima do conteúdo principal */
            z-index: 9999; 
            
            /* Remove a borda padrão */
            border: none;
            
            /* 
               A MUDANÇA MAIS IMPORTANTE:
               A propriedade 'pointer-events: none' foi REMOVIDA daqui.
               Agora, o próprio arquivo 'chat.html' controla o que é clicável ou não,
               tornando o fundo do seu iframe transparente para cliques, mas mantendo
               o botão e a janela do chat interativos.
            */
        }
    </style>
</head>
<body>

    <!-- Site principal - Carregado no iframe de baixo -->
    <div class="iframe-wrapper">
        <iframe id="main-iframe" src="https://portal.oab-sc.org.br/site" sandbox="allow-scripts"></iframe>
    </div>

    <!-- 
      Camada do Chat:
      Este iframe carrega o seu 'chat.html' por cima de tudo.
      Como o 'chat.html' tem um fundo transparente a cliques, você consegue interagir
      com o site principal que está por baixo sem problemas.
    -->
    <iframe id="chat-overlay-iframe" src="chat.html" allow="microphone"></iframe>

</body>
</html>
